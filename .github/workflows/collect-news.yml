name: Collect overseas news candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect source headlines
        run: npm run collect
      - name: Upload candidates for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: news-candidates
          path: data/news-candidates.json
          retention-days: 7
